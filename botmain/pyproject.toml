[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gwbot"
version = "0.1.0"
description = "Screen-reading win-seeking assistant for Graphwar"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "opencv-python>=4.8,<5",
    "scipy>=1.11",
    "Pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
